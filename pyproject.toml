[project]
name = "autoapply"
version = "0.1.0"
description = "Local-first, $0-marginal-cost job-application agent (Ollama + Playwright + SQLite)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "rapidfuzz>=3.9",
]

[project.scripts]
autoapply = "autoapply.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoapply"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# ATSKind is intentionally `str, Enum` (frozen interface, `.value` used everywhere).
ignore = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
