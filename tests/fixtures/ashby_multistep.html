<!DOCTYPE html>
<html>
<head><title>Acme AI — Machine Learning Engineer</title>
<style>
  ._fieldEntry_x1 { margin: 8px 0; }
  ._required_z { color: red; }
  [hidden] { display: none; }
</style>
</head>
<body>
<div class="ashby-application">
  <section class="_section_ab1" data-step="1">
    <h2 class="_sectionTitle_ab1">Your information</h2>
    <div class="_fieldEntry_x1">
      <label for="_systemfield_name">Name <span class="_required_z">*</span></label>
      <input id="_systemfield_name" name="_systemfield_name" type="text" aria-required="true" autocomplete="name">
    </div>
    <div class="_fieldEntry_x1">
      <label for="_systemfield_email">Email <span class="_required_z">*</span></label>
      <input id="_systemfield_email" name="_systemfield_email" type="email" aria-required="true" autocomplete="email">
    </div>
    <div class="_fieldEntry_x1">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel">
    </div>
    <div class="_fieldEntry_x1">
      <div class="_label_y2">Resume <span class="_required_z">*</span></div>
      <button type="button" onclick="document.getElementById('resume-input').click()">Upload File</button>
      <input id="resume-input" name="_systemfield_resume" type="file" style="display:none" aria-required="true">
    </div>
    <button type="button" id="next-btn"
      onclick="document.getElementById('step2').hidden = false">Next</button>
  </section>

  <section class="_section_ab1" data-step="2" id="step2" hidden>
    <h2 class="_sectionTitle_ab1">Additional questions</h2>
    <div class="_fieldEntry_x1" role="group" aria-required="true">
      <div class="_label_y2">Are you authorized to work in the United States? <span class="_required_z">*</span></div>
      <label><input type="radio" name="work_auth" value="yes"> Yes</label>
      <label><input type="radio" name="work_auth" value="no"> No</label>
    </div>
    <div class="_fieldEntry_x1">
      <div class="_label_y2">Will you now or in the future require sponsorship?</div>
      <label><input type="radio" name="sponsorship" value="yes"> Yes</label>
      <label><input type="radio" name="sponsorship" value="no"> No</label>
    </div>
    <div class="_fieldEntry_x1">
      <label for="why">Why do you want to work at Acme?</label>
      <textarea id="why" name="why"></textarea>
    </div>
    <div class="_fieldEntry_x1">
      <label><input type="checkbox" name="relocate"> Willing to relocate</label>
    </div>
    <button type="submit" id="submit-btn"
      onclick="window.__submitted = true">Submit Application</button>
  </section>
</div>
<script>window.__submitted = false;</script>
</body>
</html>
